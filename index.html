<!DOCTYPE html>
<html>
<head>
  <title>CUT</title>
  <style>
    body {
      margin: 0;
      background: #0b0000;
      color: #ff1a1a;
      font-family: Arial, sans-serif;
      text-align: center;
      overflow-x: hidden;
    }

    h1 {
      margin-top: 80px;
      font-size: 50px;
      letter-spacing: 5px;
    }

    #timer {
      font-size: 60px;
      margin: 40px;
      text-shadow: 0 0 20px red;
    }

    button {
      padding: 15px 40px;
      font-size: 20px;
      background: #990000;
      border: none;
      border-radius: 10px;
      color: white;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #cc0000;
      box-shadow: 0 0 20px red;
    }

    /* Blood drip animation */
    .drip {
      position: fixed;
      top: -50px;
      width: 10px;
      height: 50px;
      background: red;
      border-radius: 50%;
      animation: drip 5s infinite;
      opacity: 0.7;
    }

    @keyframes drip {
      0% { top: -50px; }
      100% { top: 100vh; }
    }
  </style>
</head>
<body>

<h1>CUT</h1>
<div id="timer">Loading...</div>
<button onclick="resetTimer()">RESET</button>

<script>
  const WORKER_URL = "PASTE_YOUR_WORKER_URL_HERE";

  let startTime = 0;

  async function fetchTime() {
    const res = await fetch(WORKER_URL);
    const data = await res.json();
    startTime = data.startTime;
  }

  function updateTimer() {
    if (!startTime) return;

    const diff = Date.now() - startTime;

    const seconds = Math.floor(diff / 1000) % 60;
    const minutes = Math.floor(diff / (1000 * 60)) % 60;
    const hours = Math.floor(diff / (1000 * 60 * 60)) % 24;
    const days = Math.floor(diff / (1000 * 60 * 60 * 24));

    document.getElementById("timer").innerText =
      `${days}d ${hours}h ${minutes}m ${seconds}s`;
  }

  async function resetTimer() {
    const confirmReset = confirm("Remember your progress before resetting. Continue?");
    if (!confirmReset) return;

    await fetch(WORKER_URL, { method: "POST" });
    await fetchTime();
  }

  setInterval(updateTimer, 1000);
  setInterval(fetchTime, 5000);

  fetchTime();

  // Create random blood drips
  setInterval(() => {
    const drip = document.createElement("div");
    drip.className = "drip";
    drip.style.left = Math.random() * 100 + "vw";
    drip.style.animationDuration = (3 + Math.random() * 4) + "s";
    document.body.appendChild(drip);
    setTimeout(() => drip.remove(), 7000);
  }, 800);
</script>

</body>
</html>
