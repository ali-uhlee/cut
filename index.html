<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CUT</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Cinzel', serif;
}

body {
    height: 100vh;
    background: linear-gradient(270deg, #000000, #1a0000, #330000, #000000);
    background-size: 800% 800%;
    animation: bgMove 20s ease infinite;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    color: #ff2b2b;
}

@keyframes bgMove {
    0% {background-position:0% 50%}
    50% {background-position:100% 50%}
    100% {background-position:0% 50%}
}

.container {
    text-align: center;
    padding: 40px;
    border-radius: 25px;
    background: rgba(20,0,0,0.8);
    backdrop-filter: blur(10px);
    box-shadow: 0 0 40px rgba(255,0,0,0.4);
    position: relative;
    z-index: 2;
}

h1 {
    font-size: 60px;
    margin-bottom: 20px;
    animation: flicker 3s infinite;
}

@keyframes flicker {
    0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% {opacity: 1;}
    20%, 24%, 55% {opacity: 0.4;}
}

#timer {
    font-size: 48px;
    transition: all 0.3s ease;
}

button {
    margin-top: 30px;
    padding: 12px 30px;
    border-radius: 50px;
    border: none;
    background: linear-gradient(145deg,#5a0000,#990000);
    color: white;
    font-size: 18px;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background: #cc0000;
    transform: scale(1.05);
}

/* Damage Bar */
#damageBarContainer {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 6px;
    background: #200000;
}

#damageBar {
    height: 100%;
    width: 0%;
    background: red;
    transition: width 1s linear;
}

/* Blood pooling */
#bloodPool {
    position: fixed;
    bottom: 0;
    width: 100%;
    height: 0;
    background: linear-gradient(to top, #8b0000, transparent);
    transition: height 1s ease;
}

/* Scar lines */
.scar {
    position: fixed;
    width: 200px;
    height: 3px;
    background: rgba(255,0,0,0.6);
    transform: rotate(25deg);
    animation: scarFade 1.5s forwards;
}

@keyframes scarFade {
    0% {opacity: 1;}
    100% {opacity: 0;}
}

/* Reset animation */
#overlay {
    position: fixed;
    width: 100%;
    height: 100%;
    background: black;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.8s ease;
    z-index: 5;
}

.splash {
    position: fixed;
    width: 200px;
    height: 200px;
    background: radial-gradient(circle, red 40%, transparent 70%);
    border-radius: 50%;
    animation: splash 1s forwards;
    z-index: 6;
}

@keyframes splash {
    0% {transform: scale(0.2); opacity:1;}
    100% {transform: scale(3); opacity:0;}
}

</style>
</head>

<body>

<div id="damageBarContainer">
    <div id="damageBar"></div>
</div>

<div class="container">
    <h1>CUT</h1>
    <div id="timer">Loading...</div>
    <button onclick="resetTimer()">Reset</button>
</div>

<div id="bloodPool"></div>
<div id="overlay"></div>

<script>

let startTime = localStorage.getItem("cutStartTime");

if (!startTime) {
    startTime = Date.now();
    localStorage.setItem("cutStartTime", startTime);
}

function updateTimer() {
    const now = Date.now();
    const diff = now - startTime;

    const seconds = Math.floor(diff / 1000) % 60;
    const minutes = Math.floor(diff / (1000 * 60)) % 60;
    const hours = Math.floor(diff / (1000 * 60 * 60)) % 24;
    const days = Math.floor(diff / (1000 * 60 * 60 * 24));

    document.getElementById("timer").innerText =
        `${days}d ${hours}h ${minutes}m ${seconds}s`;

    // Damage bar fills over 30 days
    let percent = Math.min((days / 30) * 100, 100);
    document.getElementById("damageBar").style.width = percent + "%";

    // Blood pool rises over time
    let poolHeight = Math.min(days * 2, 200);
    document.getElementById("bloodPool").style.height = poolHeight + "px";
}

setInterval(updateTimer, 1000);
updateTimer();

/* Random scar effect */
setInterval(() => {
    const scar = document.createElement("div");
    scar.classList.add("scar");
    scar.style.top = Math.random() * window.innerHeight + "px";
    scar.style.left = Math.random() * window.innerWidth + "px";
    document.body.appendChild(scar);
    setTimeout(() => scar.remove(), 1500);
}, 5000);

/* Reset with animation */
function resetTimer() {
    const overlay = document.getElementById("overlay");
    overlay.style.opacity = "0.8";

    const splash = document.createElement("div");
    splash.classList.add("splash");
    splash.style.top = "50%";
    splash.style.left = "50%";
    splash.style.transform = "translate(-50%, -50%)";
    document.body.appendChild(splash);

    setTimeout(() => {
        localStorage.setItem("cutStartTime", Date.now());
        startTime = Date.now();
        overlay.style.opacity = "0";
        splash.remove();
    }, 1000);
}

</script>

</body>
</html>
