<!DOCTYPE html>
<html>
<head>
  <title>CUT</title>

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#990000">
  <link rel="icon" href="icon.png">

  <style>
    body {
      margin: 0;
      background: #0b0000;
      color: #ff1a1a;
      font-family: Arial, sans-serif;
      text-align: center;
      overflow-x: hidden;
    }

    h1 {
      margin-top: 80px;
      font-size: 50px;
      letter-spacing: 5px;
    }

    #timer {
      font-size: 60px;
      margin: 40px;
      text-shadow: 0 0 20px red;
    }

    button {
      padding: 15px 40px;
      font-size: 20px;
      background: #990000;
      border: none;
      border-radius: 10px;
      color: white;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #cc0000;
      box-shadow: 0 0 20px red;
    }

    .drip {
      position: fixed;
      top: -50px;
      width: 10px;
      height: 50px;
      background: red;
      border-radius: 50%;
      animation: drip linear forwards;
      opacity: 0.7;
    }

    @keyframes drip {
      to { top: 100vh; }
    }
  </style>
</head>
<body>

<h1>CUT</h1>
<div id="timer">Loading...</div>
<button onclick="resetTimer()">RESET</button>

<script>
  const username = "ali-uhlee";
  const repo = "cut";
  const branch = "main";
  const token = "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";

  const jsonUrl = `https://raw.githubusercontent.com/${username}/${repo}/${branch}/time.json`;

  let startTime = null;

  async function fetchTime() {
    try {
      const res = await fetch(jsonUrl + "?nocache=" + Date.now());
      const data = await res.json();
      startTime = data.startTime;
    } catch (err) {
      document.getElementById("timer").innerText = "Error loading time.json";
      console.error(err);
    }
  }

  function updateTimer() {
    if (!startTime) return;

    const diff = Date.now() - startTime;

    const seconds = Math.floor(diff / 1000) % 60;
    const minutes = Math.floor(diff / (1000 * 60)) % 60;
    const hours = Math.floor(diff / (1000 * 60 * 60)) % 24;
    const days = Math.floor(diff / (1000 * 60 * 60 * 24));

    document.getElementById("timer").innerText =
      `${days}d ${hours}h ${minutes}m ${seconds}s`;
  }

  async function resetTimer() {
    const confirmReset = confirm("Remember your progress before resetting. Continue?");
    if (!confirmReset) return;

    await fetch(
      `https://api.github.com/repos/${username}/${repo}/dispatches`,
      {
        method: "POST",
        headers: {
          "Accept": "application/vnd.github+json",
          "Authorization": `Bearer ${token}`
        },
        body: JSON.stringify({
          event_type: "reset_timer"
        })
      }
    );

    setTimeout(fetchTime, 4000);
  }

  setInterval(updateTimer, 1000);
  setInterval(fetchTime, 5000);

  fetchTime();

  // Blood drip generator
  setInterval(() => {
    const drip = document.createElement("div");
    drip.className = "drip";
    drip.style.left = Math.random() * 100 + "vw";
    drip.style.animationDuration = (3 + Math.random() * 4) + "s";
    document.body.appendChild(drip);
    setTimeout(() => drip.remove(), 7000);
  }, 800);
</script>

</body>
</html>
